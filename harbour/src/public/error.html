<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harbour — Error</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container { text-align: center; padding: 2rem; }
    .logo { margin-bottom: 1.5rem; }
    .logo img { max-width: 180px; height: auto; }
    .code { font-size: 4rem; font-weight: 700; color: #000000; margin-bottom: 0.25rem; }
    .message { color: #666; font-size: 1.1rem; margin-bottom: 2rem; }
    .hamster { margin-bottom: 2rem; }
    .hamster img { border-radius: 8px; max-width: 160px; }
    .back a { color: #1a73e8; text-decoration: none; font-size: 0.95rem; }
    .back a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="/public/assets/harbour_logo_black.png" alt="Harbour">
    </div>
    <div class="code" id="errorCode">404</div>
    <div class="message" id="errorMessage">Page not found</div>
    <div class="hamster">
      <img src="/public/assets/hamster.gif" alt="hamster">
    </div>
    <div class="back">
      <a href="/">← back to harbour</a>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.has("code")) document.getElementById("errorCode").textContent = params.get("code");
    if (params.has("message")) document.getElementById("errorMessage").textContent = params.get("message");
  </script>
</body>
</html>
