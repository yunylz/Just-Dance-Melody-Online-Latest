<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harbour</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container { text-align: center; padding: 2rem; }
    .logo img { max-width: 280px; height: auto; }
    .welcome { margin-top: 1.5rem; font-size: 1.5rem; font-weight: 500; color: #333; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="/public/assets/harbour_logo_black.png" alt="Harbour">
    </div>
    <p class="welcome">Welcome to Harbour!</p>
  </div>
</body>
</html>
