  #       run: |
  #         pyinstaller --clean --noconfirm --onefile --windowed --name "jdmo-launcher" launcher.py
  #     - name: Upload artifact
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: jdmo-launcher-macos
  #         path: dist/jdmo-launcher
  #         if-no-files-found: error

  release:
    name: Create Release
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
