name: Build Launcher

on:
  push:
    tags: ["*", "v*"]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Write version tag
        shell: bash
        run: echo "${GITHUB_REF_NAME}" > version.txt

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm --onefile --windowed --name "jdmo-launcher" --add-data "src/assets;src/assets" --add-data "version.txt;." --version-file version_info.txt --icon icon.ico launcher.py

      - name: Upload to CDN and update latest.json
        shell: bash
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_FQDN: ${{ secrets.S3_FQDN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          pip install boto3
          python tools/ci-upload.py

  # build-macos temporarily disabled
