services:
  api:
    build: .
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    environment:
      - PORT=${PORT:-3000}
      - MONGO_URI=${MONGO_URI}
      - REDIS_URI=${REDIS_URI}
    restart: unless-stopped
    networks:
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PORT:-3000}/status/v1/ping?isDocker=true"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  coolify:
    external: true